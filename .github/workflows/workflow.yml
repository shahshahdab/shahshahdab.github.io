name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AC7CE7: ${{ secrets.AC7CE7 }}
          B85556: ${{ secrets.B85556 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AC7CE7', '')
          sec_b = os.environ.get('B85556', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- e8fb93e941dab9e98f2ba4a134acf5245e23 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 4e29fe1ba8b513a36044fc7152ae0254762db3da588737 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
